name = "traceprop"
version = "0.5.0"
description = "Computation-level lineage tracking for NumPy"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
sqlite = []
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
parquet = ["pyarrow>=14.0"]
jax = ["jax>=0.4.1"]
torch = ["torch>=2.0"]
attribution = ["numpy>=1.24"]
unlearning = ["numpy>=1.24"]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "cython>=3.0",
]
all = ["traceprop[otel,parquet,jax,torch,attribution,unlearning,postgres,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["traceprop/exporters.py", "traceprop/_c_ext/*", "traceprop/backends/jax_backend.py", "traceprop/backends/torch_backend.py", "traceprop/stores/postgres_store.py", "traceprop/compliance/*", "traceprop/attribution/*", "traceprop/unlearning/*", "traceprop/valuation/*"]
