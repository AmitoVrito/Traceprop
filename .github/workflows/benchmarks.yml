name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install -e ".[dev]" cython

      - name: Build C extension
        run: uv run python setup.py build_ext --inplace
        continue-on-error: true

      - name: Run op-mode benchmark
        run: uv run python tests/benchmarks/bench_op_mode.py

      - name: Run batch-mode benchmark
        run: uv run python tests/benchmarks/bench_batch_mode.py
